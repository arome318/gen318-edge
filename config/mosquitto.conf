# Gen318 Edge MQTT Broker Configuration
# Local-only broker for inter-container communication

listener 1883
protocol mqtt

# Authentication — anonymous allowed (local network only)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_type error
log_type warning
log_type notice

# Message limits
max_inflight_messages 100
max_queued_messages 1000
message_size_limit 1048576

# Connection limits
max_connections 20
